name: "📰 दैनिक आदित्य भारत — 7-Edition (4-State) Hybrid Cloud Builder + WhatsApp & Email Delivery"

on:
  schedule:
    # Runs daily at 18:15 UTC (11:45 PM IST) as automatic failover when Local PC is OFF
    - cron: "15 18 * * *"
  workflow_dispatch:
    inputs:
      edition_date:
        description: "अख़बार की दिनांक (DD-MM-YYYY) या खाली छोड़ें (आज की तारीख अपने-आप लेगा)"
        required: false
        default: ""
      p1_dummy_id:
        description: "पेज 01 फ्रंट पेज डमी (AUTO / DUMMY_1 / DUMMY_2 / DUMMY_3 / DUMMY_4)"
        required: false
        default: "AUTO"
      force_cloud_build:
        description: "Local PC चालू होने पर भी जबरन क्लाउड से बनाएं? (true / false)"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  build_and_deliver_all_7_editions:
    name: "Build All 7 Editions (CG • MP • DL • RJ) & Send 1-8 Vector PDFs to WhatsApp + Email"
    runs-on: windows-latest

    steps:
      - name: "1. Checkout ADITYA-BHARAT-7-EDITION Repository"
        uses: actions/checkout@v4

      - name: "2. Resolve Edition Date (IST) & Check Hybrid Local-PC Heartbeat"
        id: check_hb
        shell: pwsh
        run: |
          $inputDate = "${{ github.event.inputs.edition_date }}"
          if ([string]::IsNullOrWhiteSpace($inputDate)) {
            $istNow = (Get-Date).ToUniversalTime().AddHours(5.5)
            $dateStr = $istNow.ToString("dd-MM-yyyy")
          } else {
            $dateStr = $inputDate.Trim()
          }
          echo "date_str=$dateStr" >> $env:GITHUB_OUTPUT

          $forceBuild = "${{ github.event.inputs.force_cloud_build }}"
          $skipCloud = "false"
          if ($forceBuild -ne "true" -and (Test-Path "published_all_editions/LAST_COMPLETED_HEARTBEAT.json")) {
            $hb = Get-Content "published_all_editions/LAST_COMPLETED_HEARTBEAT.json" | ConvertFrom-Json
            if ($hb.date_str -eq $dateStr -and $hb.source -eq "LOCAL_PC" -and $hb.editions_count -ge 7) {
              Write-Host "✅ Local PC already built all 7 editions for $dateStr! Skipping Cloud Failover."
              $skipCloud = "true"
            }
          }
          echo "skip_cloud=$skipCloud" >> $env:GITHUB_OUTPUT

      - name: "3. Install DB Hindi & DB Rasrand Newspaper Fonts on Windows Cloud Server"
        if: steps.check_hb.outputs.skip_cloud != 'true'
        shell: pwsh
        run: |
          $fontsDir = Join-Path $PWD "fonts"
          $winFonts = "C:\Windows\Fonts"
          $regPath = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts"
          Get-ChildItem -Path $fontsDir -Filter "*.ttf" | ForEach-Object {
            $dst = Join-Path $winFonts $_.Name
            Copy-Item -Path $_.FullName -Destination $dst -Force
            New-ItemProperty -Path $regPath -Name $_.BaseName -Value $_.Name -PropertyType String -Force | Out-Null
          }
          Write-Host "✅ Installed all DB Hindi & DB Rasrand fonts into Windows Cloud Server."

      - name: "4. Download Page Designer C++ Runtime from Release v1.0.0-runtime"
        if: steps.check_hb.outputs.skip_cloud != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (!(Test-Path "Page_Designer_Software/pagedesigner.exe")) {
            New-Item -ItemType Directory -Force -Path "Page_Designer_Software" | Out-Null
            gh release download v1.0.0-runtime -p "Page_Designer_Runtime.zip" -D "." --clobber
            Expand-Archive -Path "Page_Designer_Runtime.zip" -DestinationPath "Page_Designer_Software" -Force
            Write-Host "✅ Extracted Page Designer C++ Runtime."
          }

      - name: "5. Setup Python 3.11 & AI Cutout / Image Dependencies"
        if: steps.check_hb.outputs.skip_cloud != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "6. Install Python Libraries (Pillow, NumPy, SciPy, OpenCV, Rembg)"
        if: steps.check_hb.outputs.skip_cloud != 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy scipy opencv-python-headless rembg onnxruntime

      - name: "7. Build All 7 Editions (4 States) + 7 Single 1–8 Vector PDFs + Deliver to Email & WhatsApp"
        if: steps.check_hb.outputs.skip_cloud != 'true'
        shell: pwsh
        env:
          AB_EDITION_DATE: ${{ steps.check_hb.outputs.date_str }}
          AB_P1_DUMMY: ${{ github.event.inputs.p1_dummy_id || 'AUTO' }}
          PAGEDESIGNER_EXE: ${{ github.workspace }}\Page_Designer_Software\pagedesigner.exe
          AB_SMTP_EMAIL: ${{ secrets.AB_SMTP_EMAIL }}
          AB_SMTP_APP_PASSWORD: ${{ secrets.AB_SMTP_APP_PASSWORD }}
          AB_RECIPIENT_EMAILS: ${{ secrets.AB_RECIPIENT_EMAILS }}
          AB_WA_PHONE_NUMBER_ID: ${{ secrets.AB_WA_PHONE_NUMBER_ID }}
          AB_WA_ACCESS_TOKEN: ${{ secrets.AB_WA_ACCESS_TOKEN }}
          AB_WA_RECIPIENTS: ${{ secrets.AB_WA_RECIPIENTS }}
          AB_TG_BOT_TOKEN: ${{ secrets.AB_TG_BOT_TOKEN }}
          AB_TG_CHAT_ID: ${{ secrets.AB_TG_CHAT_ID }}
        run: |
          $dateStr = "${{ steps.check_hb.outputs.date_str }}"
          $dummyId = "${{ github.event.inputs.p1_dummy_id }}"
          if ([string]::IsNullOrWhiteSpace($dummyId)) { $dummyId = "AUTO" }
          python ab_daily_8page_full_edition_orchestrator.py $dateStr ALL $dummyId

      - name: "8. Upload All 7 Single 1–8 Page Vector PDFs to GitHub Releases (Unlimited Free Storage)"
        if: steps.check_hb.outputs.skip_cloud != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dateStr = "${{ steps.check_hb.outputs.date_str }}"
          $tag = "editions-$dateStr"
          $pdfs = Get-ChildItem -Path "published_all_editions/$dateStr" -Recurse -Filter "*.pdf"
          $pngs = Get-ChildItem -Path "published_all_editions/$dateStr" -Recurse -Filter "*.png"
          $allFiles = @($pdfs) + @($pngs)
          if ($allFiles.Count -gt 0) {
            gh release create $tag --title "दैनिक आदित्य भारत — सभी 7 संस्करण (1–8 पेज Vector PDF) | $dateStr" --notes "स्वचालित रूप से तैयार सभी 7 संस्करणों (रायपुर, बिलासपुर, राजनांदगांव, इंदौर, भोपाल, नई दिल्ली, जयपुर) की 1 से 8 पेज की सिंगल 100% Pure Vector PDFs।" --latest
            foreach ($f in $allFiles) {
              gh release upload $tag $f.FullName --clobber
            }
          }
